<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Financeiro IFT">
  <title>Financeiro IFT</title>
  <!-- O ícone repete o gesto do painel: barras horizontais de tamanhos
       diferentes, com a ponta arredondada, saindo todas da mesma margem.
       As medidas são grossas de propósito, para o desenho sobreviver a 16px. -->
  <rect width="32" height="32" rx="7" fill="#5B3E8E"/>
  <g fill="#EDEAE4">
    <rect x="6" y="5"  width="20" height="6" rx="3"/>
    <rect x="6" y="14" width="13" height="6" rx="3"/>
    <rect x="6" y="23" width="8"  height="6" rx="3"/>
  </g>
</svg>
